general {
    # pause the live wallpaper while locked (hyprlock blocks until unlock)
    lock_cmd = pidof hyprlock || sh -c '~/.local/bin/livewall hold; hyprlock; ~/.local/bin/livewall resume'
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lock after 10 min idle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off after 15 min
listener {
    timeout = 900
    on-timeout = ~/.local/bin/livewall hold; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; pidof hyprlock || ~/.local/bin/livewall resume
}

# Suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
